name: Security, quality, and deployment health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify application and production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      # قواعد Firestore هي حدّ الأمان الحقيقي: الواجهة تتصل بقاعدة البيانات
      # مباشرة، فأي فحص في المتصفح قابل للتجاوز. تُشغَّل على المحاكي الرسمي
      # ويحتاج Java.
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test Firestore security rules
        run: pnpm run test:rules

      - name: Check TypeScript
        run: pnpm check

      - name: Build production frontend
        run: pnpm run build:vercel

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

  verify-vercel-production:
    name: Confirm Vercel production health
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_PRODUCTION_URL: https://iqcma.com
    steps:
      - name: Wait for the Vercel Git deployment to become healthy
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$VERCEL_PRODUCTION_URL" || true)"

            if [[ "$status" =~ ^[23][0-9]{2}$ ]]; then
              echo "Vercel production is healthy (HTTP $status)."
              exit 0
            fi

            echo "Attempt $attempt/24: Vercel production returned HTTP ${status:-unavailable}; retrying in 15 seconds."
            sleep 15
          done

          echo "Vercel production did not become healthy within six minutes."
          exit 1
