name: Security, quality, and deployment health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # تشغيل يدوي: يتيح نشر القواعد فور إضافة السر من دون انتظار دفعة جديدة.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application and production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      # قواعد Firestore هي حدّ الأمان الحقيقي: الواجهة تتصل بقاعدة البيانات
      # مباشرة، فأي فحص في المتصفح قابل للتجاوز. تُشغَّل على المحاكي الرسمي
      # ويحتاج Java.
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test Firestore security rules
        run: pnpm run test:rules

      - name: Check TypeScript
        run: pnpm check

      - name: Build production frontend
        run: pnpm run build:vercel

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

  verify-vercel-production:
    name: Confirm Vercel production health
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_PRODUCTION_URL: https://iqcma.com
    steps:
      - name: Wait for the Vercel Git deployment to become healthy
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$VERCEL_PRODUCTION_URL" || true)"

            if [[ "$status" =~ ^[23][0-9]{2}$ ]]; then
              echo "Vercel production is healthy (HTTP $status)."
              exit 0
            fi

            echo "Attempt $attempt/24: Vercel production returned HTTP ${status:-unavailable}; retrying in 15 seconds."
            sleep 15
          done

          echo "Vercel production did not become healthy within six minutes."
          exit 1

  # قواعد Firestore وStorage هي حدّ الأمان الحقيقي، والعميل يتصل بقاعدة
  # البيانات مباشرة. دمج القواعد في main لا يعني نشرها: بقيت مرة كاملةً في
  # المستودع بينما الإنتاج يعمل بقواعد قديمة. هذه المهمة تسدّ تلك الفجوة —
  # كل دمج في main ينشر القواعد بعد نجاح اختباراتها على المحاكي.
  deploy-firebase-rules:
    name: Deploy Firestore and Storage security rules
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: firebase-rules-deploy
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0759922046
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # السر غائب في مستودع لم يُهيّأ بعد. لا نُفشل الدمج، لكن لا نصمت:
      # تحذير ظاهر في ملخّص التشغيل حتى لا تظنّ القواعد منشورةً وهي ليست كذلك.
      - name: Check for the deployment credential
        id: credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Firebase rules were NOT deployed::The FIREBASE_SERVICE_ACCOUNT secret is missing, so firestore.rules and storage.rules stay unpublished. Production is still running the previously deployed rules. See docs/firebase-rules-deployment.md."
            {
              echo "## ⚠️ لم تُنشر قواعد Firebase"
              echo
              echo "السر \`FIREBASE_SERVICE_ACCOUNT\` غير مضاف في إعدادات المستودع، فبقيت قواعد الإنتاج على نسختها السابقة."
              echo
              echo "خطوات الإضافة مرة واحدة في \`docs/firebase-rules-deployment.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      # يُكتب المفتاح خارج مساحة العمل حتى لا يلتقطه أمرٌ يمشّط المستودع،
      # ويُتحقّق من مطابقته للمشروع المقصود: مفتاح مشروع آخر ينشر القواعد في
      # المكان الخطأ وينجح بصمت. المنطق في سكربت مستقل لأنه قابل للاختبار،
      # وأول إخفاق حقيقي أثبت الحاجة: رسالة "ليس JSON صالحاً" بلا سبب.
      - name: Materialize and validate the service account
        if: steps.credential.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY_PATH: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail

          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_PATH"

          node scripts/validateServiceAccount.mjs

      - name: Deploy the rules
        if: steps.credential.outputs.available == 'true'
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail

          pnpm exec firebase deploy \
            --only firestore:rules,storage \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

          {
            echo "## ✅ نُشرت قواعد Firebase"
            echo
            echo "| الملف | البصمة (SHA-256) |"
            echo "| --- | --- |"
            echo "| \`firestore.rules\` | \`$(sha256sum firestore.rules | cut -c1-16)\` |"
            echo "| \`storage.rules\` | \`$(sha256sum storage.rules | cut -c1-16)\` |"
            echo
            echo "المشروع: \`$FIREBASE_PROJECT_ID\` — الالتزام: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # المفتاح يُمحى دائماً، حتى لو أخفق النشر، فلا يبقى في القرص المؤقت.
      - name: Remove the credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
